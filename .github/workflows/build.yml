name: Build & Release

# main에 push되면 exe를 빌드하고, version.txt의 버전으로 태그가 아직 없을 때만
# 새 Release를 만들어 exe를 올린다.
# → 버전을 안 올리고 push하면 빌드 검증만 하고 릴리스는 건너뛴다.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "_migration_docs/**"
      - "통합시스템_설치_설명서.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 이 저장소는 public이다. 접속정보가 실수로 커밋되면 그 즉시 전 세계에 공개되므로,
      # 빌드보다 먼저 막는다. 실제 비밀값을 여기 적을 수는 없으니(그것도 유출이다)
      # "자격증명이 박힌 형태"를 패턴으로 잡는다.
      - name: 접속정보 유출 검사
        shell: bash
        run: |
          set +e
          FOUND=0
          # 중괄호를 제외하는 게 핵심 — f-string의 "postgresql://{DB_USER}:{pw}@{host}" 는
          # 자격증명이 아니라 변수 조립이라 잡으면 안 된다 (박스추천 main.py에 실제로 있음).
          # 이 워크플로 자신(패턴 문자열 포함)도 검사 대상에서 뺀다.
          if git grep -nIE '(postgres(ql)?|mysql|mongodb)(\+[a-z0-9]+)?://[^[:space:]"'"'"'{}]+:[^[:space:]"'"'"'@{}]+@' -- . ':!.github' ; then FOUND=1; fi
          # PASSWORD = "실제값" 형태
          if git grep -nIE '(PASSWORD|SECRET|API_KEY|TOKEN)[[:space:]]*=[[:space:]]*["'"'"'][^"'"'"'{}$]{6,}["'"'"']' -- . ':!.github' ; then FOUND=1; fi
          # os.getenv("DB_PASSWORD", "실제값") 형태 — 박스추천 main.py에 실제로 이 사고가
          # 있었다. 환경변수 이름이 비밀스러운 것에만 걸어 오탐(폴더 경로 기본값 등)을 피한다.
          if git grep -nIE 'getenv\([[:space:]]*["'"'"'][A-Z_]*(PASSWORD|SECRET|TOKEN|API_KEY|DATABASE_URL)[A-Z_]*["'"'"'][[:space:]]*,[[:space:]]*["'"'"'][^"'"'"']{4,}["'"'"']' -- . ':!.github' ; then FOUND=1; fi
          set -e
          if [ "$FOUND" = "1" ]; then
            echo "::error::소스에 자격증명으로 보이는 값이 있습니다. 커밋에서 제거하고 .env로 옮긴 뒤 다시 push해주세요."
            exit 1
          fi
          echo "접속정보 유출 없음"

      - name: 버전 읽기
        id: ver
        shell: bash
        run: |
          VERSION=$(tr -d ' \r\n' < version.txt)
          if [ -z "$VERSION" ]; then
            echo "::error::version.txt가 비어 있습니다."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "빌드 버전: $VERSION"

      - name: 태그 중복 확인
        id: tagcheck
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.ver.outputs.tag }} 태그가 이미 있습니다 — 빌드만 하고 릴리스는 건너뜁니다."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Windows 러너에서는 pip이 자기 자신을 교체하지 못해 실패한다
      # ([WinError 5] Access is denied: pip.exe). 반드시 python -m pip 으로 호출할 것.
      #
      # requirements.txt에는 업무 프로그램(파일찢기·박스추천·자동매칭)이 쓰는
      # 라이브러리가 전부 들어있다. 하나라도 빠지면 exe는 만들어지지만 그 프로그램만
      # 조용히 '실행할 수 없습니다'가 뜨므로 반드시 전량 설치해야 한다.
      - name: 의존성 설치
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m PyInstaller --version

      - name: exe 빌드
        shell: bash
        run: python -m PyInstaller --noconfirm --clean ENCLU_SCM.spec

      - name: 산출물 확인
        shell: bash
        run: |
          test -f dist/ENCLU_SCM.exe || { echo "::error::dist/ENCLU_SCM.exe가 생성되지 않았습니다."; exit 1; }
          ls -lh dist/ENCLU_SCM.exe

      # ⚠️ 이 단계가 없어서 지난 세 번의 사고(lxml / pykakasi 사전 / selenium 지연 import)가
      #    전부 직원 PC에 배포된 뒤에야 드러났다. 전부 exe를 한 번 실행해봤다면 잡혔을 것들이다.
      #    빌드 성공 != 동작 보장. 여기서 실제로 굴려보고 실패하면 릴리스를 막는다.
      - name: 자가진단 (배포 전 실동작 확인)
        shell: bash
        run: |
          ./dist/ENCLU_SCM.exe --selftest --no-window --ci
          code=$?
          echo "--- selftest_result.txt ---"
          cat dist/selftest_result.txt 2>/dev/null || echo "(결과 파일 없음)"
          if [ $code -ne 0 ]; then
            echo "::error::자가진단 실패 — 이 exe는 배포하면 안 됩니다. 위 결과를 확인하세요."
            exit 1
          fi

      - name: 자가진단 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ steps.ver.outputs.version }}
          path: dist/selftest_result.txt
          retention-days: 14
          if-no-files-found: warn

      - name: 빌드 산출물 업로드 (릴리스와 무관하게 항상 보관)
        uses: actions/upload-artifact@v4
        with:
          name: ENCLU_SCM-${{ steps.ver.outputs.version }}
          path: dist/ENCLU_SCM.exe
          retention-days: 14

      - name: Release 생성 및 exe 업로드
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ENCLU SCM ${{ steps.ver.outputs.tag }}
          body: |
            ENCLU SCM ALL SYSTEM ${{ steps.ver.outputs.tag }}

            **설치 방법**
            1. 아래 `ENCLU_SCM.exe`를 내려받습니다.
            2. 원하는 폴더(예: `C:\ENCLU_SCM\`)에 두고 실행합니다.
            3. 첫 실행 시 초기설정 창이 뜹니다. 폴더와 테마를 정해주세요.

            이미 쓰고 계신 분은 프로그램을 켜면 업데이트 안내가 자동으로 뜹니다.
            설정(config.json)은 업데이트 후에도 그대로 유지됩니다.
          files: dist/ENCLU_SCM.exe
          draft: false
          prerelease: false
